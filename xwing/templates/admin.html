<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#080b12"/>
  <title>X-wing — Admin</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg"/>
  <link rel="stylesheet" href="{{ asset("style.css") }}"/>
</head>
<body class="admin-body" data-user="{{ user }}" data-auth-idle-timeout="{{ auth_idle_timeout }}">
  <a class="skip-link fixed top-2.5 left-2.5 z-modal -translate-y-[160%] px-3 py-2 border border-solid border-xw-accent-border rounded-md bg-xw-panel text-xw-text font-sans text-xs no-underline transition-transform duration-[120ms] min-h-11 focus-visible:translate-y-0 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#c4b5fd]" href="#admin-main">Skip to admin content</a>
  <div id="admin-root"></div>
  <div role="region" aria-label="Loading"><div class="boot-loading h-full flex flex-col items-center justify-center gap-2 bg-xw-bg text-xw-muted font-sans fixed inset-0 z-modal pointer-events-none transition-opacity duration-[180ms] ease-out before:content-[''] before:w-[26px] before:h-[26px] before:flex-none before:rounded-full before:border-2 before:border-solid before:border-[#403769] before:border-t-xw-accent-hi before:animate-[xw-spin_.8s_linear_infinite] [&.out]:opacity-0 [&.out]:pointer-events-none" role="status">Opening admin console…</div></div>
  <div id="auth-overlay" class="auth-overlay fixed inset-0 z-modal flex items-center justify-center p-4 bg-[rgba(2,6,23,.7)] [&[hidden]]:hidden" role="status" aria-live="polite" hidden>
    <div class="auth-overlay-card flex flex-col items-stretch gap-4 w-[min(100%,384px)] p-5 border border-solid border-xw-line-hi rounded-lg bg-[rgba(15,23,42,.96)] shadow-[0_24px_70px_rgba(0,0,0,.45)]"><div class="auth-overlay-row flex items-center gap-3"><span class="auth-pulse w-9 h-9 flex-none rounded-full border border-solid border-[rgba(124,58,237,.48)] bg-[rgba(124,58,237,.14)] p-2 [&>span]:block [&>span]:w-full [&>span]:h-full [&>span]:rounded-full [&>span]:bg-xw-accent [&>span]:animate-[auth-pulse_1.2s_ease-in-out_infinite]"><span></span></span><div><h2 id="auth-overlay-title" class="mb-1 font-sans text-sm font-semibold text-[#f8fafc]">Signing out</h2><p id="auth-overlay-message" class="text-xw-muted text-xs leading-tight">Ending your session…</p></div></div><button id="auth-overlay-action" class="button primary inline-flex items-center justify-center gap-2 w-full h-11 min-h-11 px-3 border border-solid border-xw-accent-border rounded-md bg-xw-accent-fill text-white text-xs font-medium no-underline whitespace-nowrap cursor-pointer [&:hover:not(:disabled)]:bg-xw-accent-fill-hover" type="button" hidden>Sign in now</button></div>
  </div>
  <script type="application/json" id="admin-bootstrap">{{ {"user": user, "ldapConfigured": ldap_configured} | tojson }}</script>
  <script type="module" src="{{ asset("admin.js") }}"></script>
</body>
</html>
