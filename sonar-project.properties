sonar.organization=anudeepd
sonar.projectKey=anudeepd_xwing

# Keep the scan on application source. Tests, generated bundles, and build tooling live outside it.
sonar.exclusions=.venv/**,.git/**,.github/**,.pytest_cache/**,.scannerwork/**,dist/**,xwing.egg-info/**,scripts/**,tests/**,**/__pycache__/**,**/*.pyc,**/*.pyo,xwing/static/**,xwing/templates/**,xwing/frontend/node_modules/**,xwing/frontend/package*.json,xwing/frontend/*.config.*,**/*.d.ts,eslint.config.mjs,tsconfig.json,pyrightconfig.json,ldapgate.yaml

sonar.python.coverage.reportPaths=coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=scripts/coverage/lcov.info,scripts/coverage-e2e/lcov.info
