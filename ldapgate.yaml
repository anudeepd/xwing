ldap:
    url: ldaps://ldap.example.com:636
    bind_dn: cn=svc,dc=example,dc=com
    bind_password: "replace-with-bind-password"
    base_dn: dc=example,dc=com
    user_filter: "(uid={username})"
    # Sized for login bursts across at least 200 active users.
    timeout: 30
    pool_size: 16
    allowed_users:
        - alice
        - bob
proxy:
    backend_url: http://localhost:8989
    secret_key: replace-with-at-least-32-random-characters
    # Optional browser inactivity timeout in seconds. 0 disables idle expiry.
    idle_timeout: 0
    app_name: X-wing
    secure_cookies: true
    # Largest request the gate lets through. Uploads arrive in --max-chunk-mb
    # windows (64 MiB by default) and a smaller limit rejects them with a bare
    # 413, so keep this at or above the window size. Lower both together if you
    # would rather shift less data per retry.
    max_body_size: 67108864
